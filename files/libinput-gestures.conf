# User configuration for libinput-gestures
# Touchpad device
device PIXA3854:00 093A:0274 Touchpad

# Swipe gestures (default)
# Use xdotool for workspace switching (doesn't require wmctrl)
gesture swipe up	xdotool key super+Page_Down
gesture swipe down	xdotool key super+Page_Up
gesture swipe left	xdotool key alt+Right
gesture swipe right	xdotool key alt+Left

# Pinch gestures for zoom
# Pinch in (zoom out): Ctrl+minus
gesture pinch in	xdotool key ctrl+minus
# Pinch out (zoom in): Ctrl+plus
gesture pinch out	xdotool key ctrl+plus
# Pinch clockwise/anticlockwise (optional rotate)
# gesture pinch clockwise xdotool key ctrl+r
# gesture pinch anticlockwise xdotool key ctrl+shift+r

# Hold gesture (optional)
# gesture hold on 3 xdotool key ctrl+t

# Swipe threshold (dots)
swipe_threshold 50

# Gesture timeout (seconds)
timeout 1.5
