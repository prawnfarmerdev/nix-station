Section "InputClass"
    Identifier "Framework Touchpad"
    MatchProduct "PIXA3854:00 093A:0274 Touchpad"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"

    # Enable tap-to-click
    Option "Tapping" "on"

    # Tap button mapping: 1 finger = left, 2 fingers = right, 3 fingers = middle
    Option "TappingButtonMap" "lrm"

    # Enable natural scrolling (reverse direction)
    Option "NaturalScrolling" "true"

    # Scroll method: two-finger scrolling
    Option "ScrollMethod" "two-finger"

    # Click method: clickfinger (two-finger tap for right click, three-finger for middle)
    Option "ClickMethod" "clickfinger"

    # Enable gesture support (pinch-to-zoom, swipe, etc.)
    Option "Gesture" "on"

    # Disable edge scrolling (use two-finger scrolling)
    Option "ScrollEdge" "false"

    # Enable horizontal scrolling
    Option "HorizontalScrolling" "true"
    Option "ScrollPixelDistance" "15"

    # Disable while typing
    Option "DisableWhileTyping" "true"

    # Enable middle emulation (three-finger tap for middle click)
    Option "MiddleEmulation" "true"

    # Enable tap-and-drag
    Option "TapAndDrag" "true"
EndSection
